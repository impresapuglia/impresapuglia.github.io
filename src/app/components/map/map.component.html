<div class="relative h-full w-full bg-canvas">
  <!-- Contenitore Leaflet -->
  <div #mapContainer class="h-full w-full" role="application"
       aria-label="Mappa choropleth dei comuni pugliesi"></div>

  <!-- Contatore comuni visibili -->
  @if (!loading() && !error()) {
    <div class="pointer-events-none absolute bottom-4 left-4 z-[500] hidden rounded-lg border border-shell-3 bg-shell/95 px-3 py-2 text-xs backdrop-blur-sm sm:block">
      <span class="font-semibold tabular-nums text-mint-pale">{{ visibili() }}</span>
      <span class="text-ink-dim"> comuni visualizzati</span>
    </div>
  }

  <!-- Fonte dei confini -->
  <p class="pointer-events-none absolute bottom-1 left-4 z-[500] hidden text-[10px] text-ink-soft sm:block">
    Confini comunali ISTAT
  </p>

  <!-- Ritorno alla vista regionale -->
  <!-- Sotto lg l'etichetta lascia il posto all'icona: la fascia in alto e
       occupata dalla card di riepilogo, e questo bottone scende sotto di essa
       insieme ai controlli di zoom. -->
  <button
    type="button"
    (click)="inquadraPuglia()"
    aria-label="Inquadra la Puglia"
    class="absolute right-3 top-[6.25rem] z-[500] flex h-11 w-11 items-center justify-center rounded-lg border border-shell-3 bg-shell/95 text-ink-dim backdrop-blur-sm transition hover:border-mint hover:text-white focus:outline-none focus:ring-2 focus:ring-mint lg:right-4 lg:top-4 lg:h-auto lg:w-auto lg:px-3 lg:py-2 lg:text-xs lg:font-medium"
  >
    <svg class="h-5 w-5 lg:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15" />
    </svg>
    <span class="hidden lg:inline">Inquadra la Puglia</span>
  </button>

  <!-- Stato di caricamento -->
  @if (loading()) {
    <div class="absolute inset-0 z-[600] flex items-center justify-center bg-canvas">
      <div class="flex flex-col items-center gap-3">
        <div class="h-8 w-8 animate-spin rounded-full border-2 border-mint border-t-transparent"></div>
        <p class="text-sm text-ink-dim">Caricamento dei dati comunali…</p>
      </div>
    </div>
  }

  <!-- Errore di caricamento -->
  @if (error()) {
    <div class="absolute inset-0 z-[600] flex items-center justify-center bg-canvas p-6">
      <div class="max-w-md rounded-xl border border-down/50 bg-shell-2 p-5 text-center">
        <p class="mb-1 font-semibold text-white">Dati non disponibili</p>
        <p class="text-sm text-ink-dim">{{ error() }}</p>
      </div>
    </div>
  }
</div>
