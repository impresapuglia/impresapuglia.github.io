<div class="flex h-screen flex-col bg-surface">
  <!-- ============ NAVBAR ============ -->
  <header class="z-[900] flex h-16 shrink-0 items-center gap-3 border-b border-shell-2 bg-shell px-4 text-white">
    @if (vistaMappa()) {
      <button
        type="button"
        (click)="toggleSidebar()"
        aria-label="Apri i filtri"
        class="rounded-lg p-2 text-ink-dim transition hover:bg-shell-2 hover:text-white lg:hidden"
      >
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M2 5.75A.75.75 0 0 1 2.75 5h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 5.75Zm0 4.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 10Zm0 4.25a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H2.75a.75.75 0 0 1-.75-.75Z" />
        </svg>
      </button>
    }

    <a routerLink="/" class="flex min-w-0 items-center gap-3 rounded-lg transition hover:opacity-90">
      <app-logo class="block h-10 w-10 shrink-0" />
      <div class="min-w-0">
        <h1 class="truncate text-[15px] font-semibold leading-tight tracking-tight">
          Impresa<span class="text-mint">Puglia</span>
        </h1>
        <p class="hidden truncate text-[10px] uppercase tracking-wider2 text-ink-dim sm:block">
          L'imprenditoria pugliese sulla mappa
        </p>
      </div>
    </a>

    <nav class="ml-auto flex items-center gap-1" aria-label="Navigazione">
      <div class="flex items-center gap-1 rounded-xl bg-shell-2 p-1">
        <a
          routerLink="/mappa"
          routerLinkActive="bg-shell-3 text-white"
          class="rounded-lg px-3 py-1.5 text-xs font-medium text-ink-dim transition hover:text-white sm:text-sm"
        >
          Mappa
        </a>
        <a
          routerLink="/opportunita"
          routerLinkActive="bg-shell-3 text-white"
          class="rounded-lg px-3 py-1.5 text-xs font-medium text-ink-dim transition hover:text-white sm:text-sm"
        >
          Opportunità
        </a>
      </div>
      <a
        routerLink="/guida"
        routerLinkActive="text-gold-2"
        aria-label="Guida alla lettura"
        class="ml-1 rounded-lg p-2 text-ink-dim transition hover:bg-shell-2 hover:text-white"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 16v-4M12 8.5h.01" />
        </svg>
      </a>

      <button
        type="button"
        (click)="tema.alterna()"
        [attr.aria-label]="tema.tema() === 'scuro' ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
        [attr.aria-pressed]="tema.tema() === 'scuro'"
        class="rounded-lg p-2 text-ink-dim transition hover:bg-shell-2 hover:text-white"
      >
        @if (tema.tema() === 'scuro') {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg>
        } @else {
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.6 6.6 0 0 0 9.5 9.5Z" />
          </svg>
        }
      </button>
    </nav>
  </header>

  <!-- ============ CORPO ============ -->
  <div class="relative flex min-h-0 flex-1">
    @if (vistaMappa()) {
      <!-- Sidebar filtri -->
      <div
        class="absolute inset-y-0 left-0 z-[800] w-72 max-w-[85vw] transform transition-transform duration-300 ease-out lg:relative lg:z-auto lg:translate-x-0"
        [class]="sidebarAperta ? 'translate-x-0' : '-translate-x-full'"
      >
        <app-filter-panel />
      </div>

      <!-- Sfondo che chiude la sidebar su mobile -->
      @if (sidebarAperta) {
        <button
          type="button"
          (click)="chiudiSidebar()"
          aria-label="Chiudi i filtri"
          class="absolute inset-0 z-[750] bg-ink/40 lg:hidden"
        ></button>
      }
    }

    <!-- Area centrale -->
    <main class="relative min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>

  <!-- ============ ASSISTENTE (segnaposto) ============ -->
  @if (vistaMappa()) {
    <!-- Scansa il pannello di dettaglio quando è aperto, invece di coprirlo. -->
    <div
      class="fixed bottom-5 right-5 z-[1000] flex flex-col items-end gap-3 transition-[right] duration-300"
      [ngClass]="ui.comuneSelezionato() ? 'lg:right-panel' : ''"
    >
      <app-chatbot [aperto]="ui.chatAperta()" (chiudi)="ui.chiudiChat()" />

      <button
        type="button"
        (click)="ui.toggleChat()"
        [attr.aria-expanded]="ui.chatAperta()"
        aria-label="Apri l'assistente"
        class="flex h-14 w-14 items-center justify-center rounded-2xl bg-brand text-white shadow-panel ring-1 ring-white/10 transition hover:bg-brand-2 focus:outline-none focus:ring-2 focus:ring-mint focus:ring-offset-2 focus:ring-offset-surface"
      >
        @if (ui.chatAperta()) {
          <svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z" />
          </svg>
        } @else {
          <svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M10 2c-4.42 0-8 2.99-8 6.67 0 2.1 1.17 3.97 3 5.19V18l2.86-1.72c.69.15 1.4.23 2.14.23 4.42 0 8-2.99 8-6.67C18 4.99 14.42 2 10 2Z" />
          </svg>
        }
      </button>
    </div>
  }
</div>
