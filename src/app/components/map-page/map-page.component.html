<div class="relative h-full w-full overflow-hidden">
  <app-map
    class="block h-full w-full"
    [selezionato]="comune()?.istat ?? null"
    (comuneSelezionato)="onComuneSelezionato($event)"
  />

  <!-- Pannello dettaglio: scivola da destra -->
  <div
    class="absolute inset-y-0 right-0 z-[700] w-96 max-w-full transform border-l border-line bg-card shadow-panel transition-transform duration-300 ease-out"
    [class]="comune() ? 'translate-x-0' : 'translate-x-full'"
    [attr.aria-hidden]="!comune()"
  >
    <app-comune-panel [comune]="comune()" (chiudi)="chiudiPannello()" />
  </div>
</div>
